version: "3.9"
services:
  api_service:
    build: .
    restart: always
    ports:
      - 9090:8080
    networks:
      - springapimysql-net
    environment:
      # MySQL Database Configuration
      - "spring.datasource.url=jdbc:mysql://mysqldb:3306/liveChat2?useSSL=false&useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true"

      # Redis Configuration
      - "spring.redis.host=redis-spring"
      - "spring.redis.port=6379"
    depends_on:
      - redis-spring
      - mysqldb
    volumes:
      - .m2:/root/.m2

  mysqldb:
    image: mysql:latest
    restart: always
    ports:
      - 3306:3306
    networks:
      - springapimysql-net
    environment:
      MYSQL_DATABASE: liveChat2
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 9292:80
    networks:
      - springapimysql-net
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M

  redis-spring:
    image: redis:latest
    restart: always
    ports:
      - 6379:6379
    networks:
      - springapimysql-net

networks:
  springapimysql-net:
    driver: bridge
