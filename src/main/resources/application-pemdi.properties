# ===== PEMDI profile =====
# Activated by SPRING_PROFILES_ACTIVE=pemdi. The default application.properties
# (MySQL + MariaDBDialect) is left untouched; under this profile MySQL is NEVER dialled.
# To go back to standalone MySQL, just drop SPRING_PROFILES_ACTIVE.

server.port=${PORT:3005}

# PostgreSQL (pemdi_chat), same postgres-core container as core/arsitektur
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/pemdi_chat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Override the default MariaDBDialect from application.properties (same key wins under this profile).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL95Dialect
spring.jpa.hibernate.ddl-auto=update

# Redis (chat recent-window cache)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
chat.history.cache-size=${CHAT_HISTORY_CACHE_SIZE:100}

# PEMDI authorization (shared with gateway/auth-service). Native livechat auth still
# lives on /api/auth/** via application.properties; this only secures /api/chat/** + /ws-chat.
pemdi.jwt.access-secret=${JWT_ACCESS_SECRET:change-me}
pemdi.auth.service-url=${AUTH_SERVICE_URL:http://auth-service:3002}
pemdi.auth.introspect-secret=${INTROSPECT_SECRET:change-me-introspect}
pemdi.auth.introspect-cache-ms=${INTROSPECT_CACHE_TTL_MS:10000}

# Browser WebSocket origin allowlist (SockJS/STOMP cross-origin). Comma-separated.
chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:3000}

# Compose healthcheck target
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
